<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hiiragi Cast Player</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            background: #000;
            color: #fff;
            font-family: 'Segoe UI', Arial, sans-serif;
            overflow: hidden;
            user-select: none;
        }

        /* ── Idle screen ── */
        #idle {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 16px;
            background: radial-gradient(ellipse at center, #1a1a2e 0%, #000 100%);
            transition: opacity .4s;
        }

        #idle.hidden {
            opacity: 0;
            pointer-events: none;
        }

        #idle .logo {
            font-size: 48px;
            font-weight: 700;
            background: linear-gradient(135deg, #6c63ff, #ff6584);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        #idle .sub {
            font-size: 16px;
            color: #888;
        }

        #status-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #444;
            display: inline-block;
            margin-right: 6px;
            transition: background .3s;
        }

        #status-dot.connected {
            background: #4caf50;
        }

        /* ── Player ── */
        #player-wrap {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            background: #000;
            opacity: 0;
            pointer-events: none;
            transition: opacity .4s;
        }

        #player-wrap.visible {
            opacity: 1;
            pointer-events: all;
        }

        video {
            flex: 1;
            width: 100%;
            height: 100%;
            object-fit: contain;
            background: #000;
        }

        /* ── Overlay (title / controls) ── */
        #overlay {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            padding: 20px 28px 24px;
            background: linear-gradient(transparent, rgba(0, 0, 0, .85) 60%);
            transform: translateY(0);
            transition: transform .3s, opacity .3s;
        }

        #overlay.hidden {
            transform: translateY(100%);
            opacity: 0;
        }

        #media-title {
            font-size: 22px;
            font-weight: 600;
            margin-bottom: 4px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        #media-sub {
            font-size: 14px;
            color: #aaa;
            margin-bottom: 14px;
        }

        /* progress bar */
        #progress-wrap {
            position: relative;
            height: 4px;
            background: rgba(255, 255, 255, .2);
            border-radius: 2px;
            cursor: pointer;
            margin-bottom: 10px;
        }

        #progress-bar {
            height: 100%;
            background: #6c63ff;
            border-radius: 2px;
            width: 0%;
            transition: width .5s linear;
            pointer-events: none;
        }

        .ctrl-row {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .time {
            font-size: 13px;
            color: #ccc;
            min-width: 90px;
        }

        /* buffering spinner */
        #spinner {
            position: absolute;
            inset: 0;
            display: none;
            align-items: center;
            justify-content: center;
        }

        #spinner.visible {
            display: flex;
        }

        .spin {
            width: 52px;
            height: 52px;
            border: 4px solid rgba(255, 255, 255, .15);
            border-top-color: #6c63ff;
            border-radius: 50%;
            animation: spin .8s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }
    </style>
</head>

<body>

    <!-- Idle / waiting screen -->
    <div id="idle">
        <div class="logo">Hiiragi Cast</div>
        <div class="sub">
            <span id="status-dot"></span>
            <span id="status-text">Connecting to receiver…</span>
        </div>
    </div>

    <!-- Video player -->
    <div id="player-wrap">
        <video id="video" autoplay playsinline></video>

        <div id="spinner">
            <div class="spin"></div>
        </div>

        <div id="overlay">
            <div id="media-title">–</div>
            <div id="media-sub"></div>
            <div id="progress-wrap">
                <div id="progress-bar"></div>
            </div>
            <div class="ctrl-row">
                <span class="time" id="time-display">0:00 / 0:00</span>
            </div>
        </div>
    </div>

    <script src="./node_modules/dashjs/dist/dash.all.min.js"></script>
    <script src="./node_modules/hls.js/dist/hls.min.js"></script>
    <script src="renderer.js"></script>
</body>

</html>
