<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hiiragi Cast Player</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            background: #000;
            color: #fff;
            font-family: 'Segoe UI', Arial, sans-serif;
            overflow: hidden;
            user-select: none;
        }

        #idle {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 16px;
            background: radial-gradient(ellipse at center, #1a1a2e 0%, #000 100%);
            transition: opacity .4s;
        }

        #idle.hidden {
            opacity: 0;
            pointer-events: none;
        }

        #idle .logo {
            font-size: 48px;
            font-weight: 700;
            background: linear-gradient(135deg, #6c63ff, #ff6584);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        #idle .sub {
            font-size: 16px;
            color: #888;
        }

        #status-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #444;
            display: inline-block;
            margin-right: 6px;
            transition: background .3s;
        }

        #status-dot.connected {
            background: #4caf50;
        }

        /* Cast SDK receiver app */
        #cast-webview {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            opacity: 0;
        }

        /* Chrome Tab Mirroring — sits after the iframe in DOM so it paints on top */
        #mirror-canvas {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            display: none;
            background: #000;
            /* JS sets style.width/height to letterbox-fit the window on every
               resize. The GPU compositor then scales the drawing buffer pixels
               (video resolution) to those CSS pixels using Lanczos filtering. */
            image-rendering: high-quality;
        }
    </style>
</head>

<body>

    <!-- Idle / waiting screen -->
    <div id="idle">
        <div class="logo">Hiiragi Cast</div>
        <div class="sub">
            <span id="status-dot"></span>
            <span id="status-text">Connecting to receiver…</span>
        </div>
    </div>

    <!-- Cast SDK receiver app loads here.
         cast-webview-preload.js runs inside this iframe too
         (nodeIntegrationInSubFrames: true) and injects window.cast.__platform__
         before any page scripts execute. -->
    <iframe id="cast-webview" src="about:blank" frameborder="0" allow="autoplay; encrypted-media; fullscreen">
    </iframe>
    <canvas id="mirror-canvas"></canvas>
    <script src="renderer.js"></script>
</body>

</html>
