<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hiiragi Cast Player</title>
    <link rel="stylesheet" href="main.css">
</head>

<body>
    <div id="window-top-bar">

    </div>
    <!-- Idle / waiting screen -->
    <div id="idle">
        <div class="logo">Hiiragi Cast</div>
        <div class="sub">
            <span id="status-dot"></span>
            <span id="status-text">Connecting to receiver…</span>
        </div>
    </div>
    <div id="overlay">
        <button id="fullscreen">
            <span id="fullscreen-text">Use fullscreen</span>
            <svg xmlns="http://www.w3.org/2000/svg" id="fullscreen-svg" viewBox="0 0 24 24" width="36" height="36"
                fill="currentColor">
                <path d="M19,24H17a1,1,0,0,1,0-2h2a3,3,0,0,0,3-3V17a1,1,0,0,1,2,0v2A5.006,5.006,0,0,1,19,24Z" />
                <path d="M1,8A1,1,0,0,1,0,7V5A5.006,5.006,0,0,1,5,0H7A1,1,0,0,1,7,2H5A3,3,0,0,0,2,5V7A1,1,0,0,1,1,8Z" />
                <path d="M7,24H5a5.006,5.006,0,0,1-5-5V17a1,1,0,0,1,2,0v2a3,3,0,0,0,3,3H7a1,1,0,0,1,0,2Z" />
                <path
                    d="M23,8a1,1,0,0,1-1-1V5a3,3,0,0,0-3-3H17a1,1,0,0,1,0-2h2a5.006,5.006,0,0,1,5,5V7A1,1,0,0,1,23,8Z" />
            </svg>
        </button>
    </div>

    <iframe id="cast-webview" src="about:blank" frameborder="0" allow="autoplay; encrypted-media; fullscreen">
    </iframe>
    <canvas id="mirror-canvas"></canvas>
    <script src="renderer.js"></script>
</body>

</html>
